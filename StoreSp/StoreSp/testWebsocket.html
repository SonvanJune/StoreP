<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      .message {
        border: 1px solid #ddd;
        padding: 10px;
        margin-bottom: 10px;
        border-radius: 5px;
      }
      .sender,
      .receiver {
        font-weight: bold;
      }
      .sender-avatar,
      .receiver-avatar {
        width: 50px;
        height: 50px;
        border-radius: 50%;
      }
    </style>
  </head>
  <script>
    const socket = new WebSocket(
      "ws://localhost:5181/ws/chat?boxChatCode=78701"
    );
    socket.onopen = function () {
      console.log("WebSocket connection established");
    };

    socket.onmessage = function (event) {
      const data = JSON.parse(event.data).data;
      data.forEach((item) => {
        const messageElement = document.createElement("div");
        messageElement.className = "message";

        messageElement.innerHTML = `
                <div>
                    <img src="${item.Sender.Avatar}" alt="${item.Sender.Name}'s Avatar" class="sender-avatar">
                    <span class="sender">${item.Sender.Name} (${item.Sender.Username})</span>
                </div>
                <div>
                    <img src="${item.Receiver.Avatar}" alt="${item.Receiver.Name}'s Avatar" class="receiver-avatar">
                    <span class="receiver">${item.Receiver.Name} (${item.Receiver.Username})</span>
                </div>
                <div>
                    <strong>Message:</strong> ${item.Text}
                </div>
                <div>
                    <strong>Created At:</strong> ${item.CreatedAt}
                </div>
                <div>
                    <strong>Status:</strong> ${item.Status}
                </div>
            `;

        // Thêm HTML vào phần tử chứa
        messagesContainer.appendChild(messageElement);
      });
    };

    socket.onclose = function () {
      console.log("WebSocket connection closed");
    };

    function sendMessage() {
      // const message = document.getElementById("message").value;
      const data = {
        sender: "21211tt2356@mail.tdc.edu.vn",
        message: "Hello 21211tt2356@mail.tdc.edu.vn",
        username: "sonthu3333@gmail.com",
      };
      socket.send(JSON.stringify(data));
    }
  </script>
  <body>
    <title>Document</title>
    <div id="messagesContainer"></div>
    <button onclick="sendMessage()">Send</button>
  </body>
</html>
